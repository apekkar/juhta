name: security-checks
description: >
  cdk-nag (AWS Solutions rules) on all CDK stacks, zizmor on GitHub Actions,
  gitleaks on the git history, pip-audit and npm audit on dependencies. Any
  finding fails the job; accepted exceptions are acknowledged in code with a reason.

inputs:
  aws-region:
    required: true
  bedrock-model-id:
    required: true
  coordinator-model-id:
    required: true
  slack-user-id:
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-env
      with:
        python: "true"
        node: "false"

    # Synth fails on unacknowledged cdk-nag findings; the dashboard build is a placeholder.
    - name: cdk-nag
      run: mkdir -p dashboard/dist && touch dashboard/dist/index.html && uv run --directory cdk python app.py
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        BEDROCK_MODEL_ID: ${{ inputs.bedrock-model-id }}
        COORDINATOR_MODEL_ID: ${{ inputs.coordinator-model-id }}
        SLACK_USER_ID: ${{ inputs.slack-user-id }}

    - name: zizmor (GitHub Actions)
      run: uvx zizmor@1.30.1 --min-severity medium .github/
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}  # online audits read action metadata

    # gitleaks v8.30.1, pinned by digest
    - name: gitleaks (secrets in git history)
      run: >
        docker run --rm -v "$PWD:/repo"
        ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        git /repo --redact --no-banner
      shell: bash

    - name: pip-audit (Python dependencies)
      run: >
        uv export --format requirements-txt --no-hashes --all-groups --no-emit-project
        | uvx pip-audit@2.10.1 -r /dev/stdin --disable-pip --no-deps
      shell: bash

    - name: npm audit (dashboard dependencies)
      run: npm audit --audit-level=high
      shell: bash
      working-directory: dashboard
