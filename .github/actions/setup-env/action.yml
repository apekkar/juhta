name: setup-env
description: >
  Toolchains and dependencies for this repo: uv + Python packages (uv.lock) and/or
  Node + dashboard packages (dashboard/package-lock.json), both cached.

inputs:
  python:
    description: Install uv and the Python packages (uv sync --locked).
    default: "true"
  node:
    description: Install Node 24 and the dashboard's npm packages (npm ci).
    default: "true"

runs:
  using: composite
  steps:
    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
    - if: inputs.python == 'true'
      run: uv sync --locked
      shell: bash

    - if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: dashboard/package-lock.json
    - if: inputs.node == 'true'
      run: npm ci
      shell: bash
      working-directory: dashboard
